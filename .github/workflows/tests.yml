name: tests

# Linux-only checks cannot establish macOS portability. Both POSIX legs
# run the same real-subprocess behavioral suite against disposable git
# repositories through Nitjsefnie-Actions/test-ratchet: `plan` splits the
# test files into shards, `run` runs one shard with coverage measured on
# every cell, and `report` gates the ubuntu cell's merged coverage against
# the floor in .github/ci-thresholds.json.
# The action itself imports the standard library and nothing else; the
# suite does not: it needs pytest and PyYAML from the hash-pinned
# .github/workflows/requirements-test.txt, into the interpreter
# actions/setup-python provides (see the Install the regression toolchain
# step), and `run` installs its own pinned pytest and coverage toolchain
# into that interpreter.

on:
  push:
    # Default branch only: a pull-request head already gets one run from
    # the `pull_request` event below, and an unfiltered `push` schedules
    # the same commit a second time under a different ref, which the
    # `concurrency` group cannot collapse.
    branches: [main]
  pull_request:
  # Manual runs re-check main without a push. The size-baseline job's steps'
  # `if` names only pull requests and default-branch pushes, so a run on any
  # other ref completes that job green without measuring, as on any other
  # event.
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes; later steps must not inherit a stored token.
          persist-credentials: false

      - name: Require this head to carry main's gate-defining commits
        # The `require-ci-aggregate` ruleset sets
        # strict_required_status_checks_policy to false, so a green head
        # vouches only for the tree this run checked
        # out: a commit that lands on main touching a file a required check
        # reads is never applied to a pull request before it merges, and the
        # merge then publishes a tree no green run ever saw. This is the only
        # check that compares the two.
        #
        # In a job the required `aggregate` already folds, because a new job
        # reaches the ruleset only once it is added to the aggregate's `needs`,
        # and a `paths:` filter on a workflow whose job the aggregate folds
        # would stop this reporting at all and block every pull request
        # instead.
        #
        # Before the lint step: work done against a base main has already moved
        # on from is work whose verdict does not carry.
        if: github.event_name == 'pull_request'
        run: python3 tests/gate_base_freshness.py

      - name: Refuse a commit whose scope names a workflow outside the ci type
        # CONTRIBUTING.md's scope table allows a workflow's name as a scope
        # only with type `ci`, and prose no gate reads is a convention. In this
        # job rather than a new one: a new job reaches the ruleset only once it
        # is added to the required `aggregate`'s `needs`, and a job the
        # aggregate already folds is where the freshness step went for the
        # same reason.
        # After the freshness step: both compare the head against freshly
        # fetched main, and both must read the rebased head.
        run: python3 tests/commit_scopes.py

      # ShellCheck ships with the image (0.9.0-1 on ubuntu-24.04, which
      # ubuntu-latest currently maps to, per the runner-images docs:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md),
      # so no install step: its apt mirror fetch hung intermittently until
      # the job timeout, while a missing binary fails the step in seconds
      # instead of hanging.

      - name: Check every shell file
        # Recurse so adding a nested test helper cannot silently escape lint,
        # and read the shared scripts by the same rule.
        run: |
          find tests .github/scripts -type f -name '*.sh' -exec shellcheck {} +

  secrets:
    # The gitleaks scan, defined once in secrets.yml. Calling it keeps the
    # scan inside this workflow's required aggregate while that file's own
    # schedule re-answers the history; a standalone workflow's job would be
    # no required context and could go red without blocking a merge.
    uses: ./.github/workflows/secrets.yml # zizmor: ignore[self-repository] actionlint refuses the $/ spelling

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          tests: tests/**/test_*.py
          times: .github/test-times.json
          shards: 2

  suites:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so no token is left in .git/config
          # for a later step to reuse.
          persist-credentials: false

      # One Python minor on both legs: the manifest's hashes cover the 3.15
      # artifacts for Linux x86_64 and macOS arm64, and the action selects
      # the same '3.15' for consumers.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check no tracked file carries a merge-conflict marker
        # Only a mechanical check sees a marker that reads as prose in a
        # Markdown file, and -I keeps a binary from being reported as a match.
        # The markers are matched in the shapes git writes them: `<<<<<<< `
        # and `>>>>>>> ` carry the label after seven characters, the separator
        # is exactly seven `=`, and diff3's extra `||||||| base` line changes
        # nothing, because the other three are still written. This job rather
        # than the actionlint one because this workflow's push trigger is
        # unfiltered: it runs for the documentation-only commit that carries
        # the marker as well as for the code change.
        # Explicit `shell: bash` adds --noprofile --norc, and pipefail is its
        # only operative delta -- the body already guards `git grep` with
        # `|| found=$?`, so no pipe here can turn "no match" into a failure
        # the implicit shell would not have.
        shell: bash
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Compile the runner and the policy modules
        # py_compile refuses a SyntaxError in seconds, before the suite pays
        # for a run; the suite then exercises every module behaviorally.
        run: python3 -m py_compile run.py scripts/ci/*.py

      - name: Install the regression toolchain
        # Into setup-python's interpreter, the one every later step's
        # `python3` resolves to: the runner places GITHUB_PATH entries --
        # setup-python's among them -- ahead of the job's PATH variable when
        # it builds a step's environment, so a venv put on PATH through
        # GITHUB_ENV is shadowed by it. That interpreter is a toolcache
        # install, not the image's externally managed (PEP 668) system
        # python, so pip may install into it. --require-hashes pins
        # artifacts as well as versions; --only-binary keeps an absent
        # wheel a loud failure rather than an unpinned source build;
        # PyYAML alone builds the hash-pinned sdist (no 3.15 wheel).
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r .github/workflows/requirements-test.txt

      # The cell is the OS and the Python minor, as the floor's record names
      # it, so a second minor gets its own timing and coverage records
      # instead of overwriting this one.
      - uses: Nitjsefnie-Actions/test-ratchet/run@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py3.15
          shard: ${{ matrix.shard }}

  report:
    needs: suites
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a main push the records commit is pushed with the main-push
    # environment's deploy key, as the size-baseline job's is.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && format('{0}-push', github.event.repository.default_branch) || '' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/test-ratchet/report@96562a47e9b7fe74b55cc70a4636d1b5d7b542e2 # v2.4.2
        with:
          github-token: ${{ github.token }}
          cell: ubuntu-latest-py3.15
          times: .github/test-times.json
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}

  size-baseline:
    # The README install block, with this repository pinned to its own
    # checkout and tests/ budgeted. The steps' `if` is the block's: on any
    # other event this workflow runs on the job completes green without
    # measuring. The other `with:` values are the block's: a pull request
    # is never asked to lower a record, and on a main push the action
    # commits the tightened records with the main-push environment's
    # deploy key, the one secret its environment binds only on that push.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && format('{0}-push', github.event.repository.default_branch) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Judge this run's own tree, including its local action. Full
          # history carries the base object without depending on retained
          # credentials.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
        uses: ./ # zizmor: ignore[self-repository] the block's action, from this checkout
        with:
          ceilings: ''
          overrides: ''
          exclude: ''
          unclassified: 'ignore'
          records: '.github/size-baseline.json'
          member: ''
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}
          stale: 'warn'
          require-tight: 'false'
          push-key: ${{ secrets.MASTER_PUSH_DEPLOY_KEY }}
          tree-budgets: 'tests/'

  aggregate:
    # Like claudit's aggregate: always report, including after a failed or
    # cancelled ancestor. This tree has no classification skips, so every
    # skipped, failed, cancelled or missing leg must fold red.
    # actionlint reports independently; needs can only name this workflow's legs.
    needs: [plan, suites, report, shellcheck, secrets, size-baseline]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fold the leg results into one verdict
        env:
          SIZE_RATCHET_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/aggregate_gate.py
