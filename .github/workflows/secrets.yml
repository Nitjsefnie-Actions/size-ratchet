name: secrets

# The secret scan, defined once. tests.yml calls this workflow, so the scan
# gates every pull request and every push to main through the required
# aggregate, and a caller's concurrency group governs the called run. The
# schedule below is this workflow's own and re-answers for the commits a
# pull-request run can never see: ones that landed before the scan existed,
# ones pushed with [skip ci], and any whose secret only becomes detectable
# when the scanner's rules improve with a version bump. The cron
# re-answers the whole history each morning, so such a commit is caught the
# next day rather than never.
#
# Nitjsefnie-Actions/secret-scan runs gitleaks over the whole tree and
# history. It reads .gitleaks.toml and .gitleaksignore from the commit the
# change is judged against (a pull request's base, a push's previous tip,
# otherwise the default branch's tip), and runs the default rules without
# the allowlists that exempt a file by its path alone.

on:
  workflow_call:
  schedule:
    # Off the hour, split from this repository's other crons: codeql runs
    # Wednesdays 03:47, scorecard Saturdays 02:23, audit daily 04:12.
    - cron: '41 4 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing pushes; the job token must not survive the checkout.
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@74f89d79a41106c9a65c23f20895b23240665f26 # v1.0.0
