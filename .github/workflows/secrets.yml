name: secrets

# The gitleaks scan, defined once. tests.yml calls this workflow, so the scan
# gates every pull request and every push to main through the required
# aggregate, and a caller's concurrency group governs the called run. The
# schedule below is this workflow's own and re-answers for the commits a
# pull-request run can never see: ones that landed before the scan existed,
# ones pushed with [skip ci], and any whose secret only becomes detectable
# when the frozen scanner's rules improve with a version bump. The cron
# re-answers the whole history each morning, so such a commit is caught the
# next day rather than never.
#
# THE BINARY IS FROZEN BY HAND. The version is pinned and digest-verified, so
# no run ever scans with a silently changed scanner — and every bump rescans
# the whole history under the new rules, which is the price of the bump. The
# scanner is the binary rather than gitleaks-action because that action
# requires a GITLEAKS_LICENSE secret on organization accounts, and this
# repository's org would have to hold one just to be scanned.
#
# NO CONFIG FILE. No .gitleaks.toml is committed and no --config is passed:
# the default ruleset ran clean against this repository's full history, so an
# allowlist here would be a way to silence a future finding nobody reviewed.
# --ignore-gitleaks-allow refuses a `gitleaks:allow` inline in the change
# being scanned, so a finding there cannot suppress itself; a .gitleaks.toml
# or .gitleaksignore a pull request adds is visible in its diff, which is the
# only check on that route.

on:
  workflow_call:
  schedule:
    # Off the hour, split from this repository's other crons: codeql runs
    # Wednesdays 03:47, scorecard Saturdays 02:23, audit daily 04:12.
    - cron: '41 4 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scan reads `git log -p`, so a shallow clone
          # would scan a suffix of history and call the rest clean.
          fetch-depth: 0
          # Nothing pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        # Checksum-verified rather than piped from an install script: `curl |
        # bash` would make this job trust whatever that URL serves at run
        # time. The digest is from the release's own checksums file, and
        # download.sh retries the fetch with backoff and refuses an empty
        # file.
        run: |
          tarball=gitleaks_8.30.1_linux_x64.tar.gz
          .github/scripts/download.sh "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${tarball}" "$tarball"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here. The
        # log is public: --verbose names findings, --redact masks them.
        run: ./gitleaks detect --verbose --redact --ignore-gitleaks-allow
