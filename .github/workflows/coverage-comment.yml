name: coverage-comment

# Post or invalidate the patch-coverage comment after the tests workflow.
#
# WHY THIS IS A SEPARATE WORKFLOW. `tests` checks out and executes the
# proposed tree, so that job must not also hold the token that can write pull
# request conversation. Only the rendered comment crosses this boundary; this
# workflow checks out nothing and runs no code from the pull request.
#
# The DESTINATION does not cross it either. The artifact carries a pull
# request number, but that artifact is written by a job running the pull
# request's own copy of `tests.yml`, so obeying it would let any pull request
# aim bot-authored text at any other one. The number below is resolved from
# the `workflow_run` event instead, and the artifact's copy is only compared
# with it -- a disagreement fails the step loudly rather than being corrected
# quietly, because it is the signal that somebody tried.
#
# `pull_request_target` is not the answer. As `tests.yml` explains, that
# trigger would give a run of proposed code the base repository's token and
# secrets. The workflow_run split keeps the write-capable job on this trusted
# file while the untrusted job stays read-only.

# zizmor calls `workflow_run` fundamentally insecure, and it is right about
# the usual shape: a run that checks out the pull request, or runs something
# the pull request produced, while holding a write token. This one does
# neither. It has no `actions/checkout` at all, it executes nothing from the
# artifact, and the only thing crossing from the pull request is the TEXT of
# a comment. The alternative zizmor would leave standing is the job that runs
# proposed code holding `pull-requests: write` itself, which is worse.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [tests]
    types: [completed]

# The check-run publishing daedalus's copy of this workflow does is not part
# of this port: the report's homes are the diff-coverage job's summary and
# the one pull-request comment below, so the token needs no `checks: write`.
permissions:
  pull-requests: write
  actions: read

concurrency:
  # Per head branch of the triggering run, and cancel-in-progress: two `tests`
  # runs for one branch finishing close together would otherwise each find no
  # existing comment and both post. Only the newest measurement is worth
  # having, so the older run is cancelled rather than queued. The head
  # repository and branch are what a `workflow_run` event exposes at workflow
  # level; the pull request number is not resolved until the job's steps run.
  group: >-
    coverage-comment-${{
    github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    # Every completed run gets a chance to replace an old percentage with a
    # plainly labelled "not measured" marker. Otherwise a red or cancelled
    # run leaves the previous commit's number looking current.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for the comment artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE_RATCHET_REPO: ${{ github.repository }}
          SIZE_RATCHET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # The lookup is its own command, and pipefail is load-bearing: in
          # `x="$(gh api ... | jq ...)"` the status is jq's, so a failed API
          # call would print `false` and be reported as "no artifact" -- the
          # comment silently never appears and nothing goes red.
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$SIZE_RATCHET_REPO/actions/runs/$SIZE_RATCHET_RUN_ID/artifacts" \
            --jq '.artifacts[]' > artifacts.json
          then
            echo "listing the artifacts of run $SIZE_RATCHET_RUN_ID failed" >&2
            exit 1
          fi
          # Collect every paginated object into one array before selecting.
          present="$(jq -s 'any(.[]; .name == "diff-coverage-comment" and
            .expired == false)' artifacts.json)"
          case "$present" in
            true) echo 'present=true' >> "$GITHUB_OUTPUT" ;;
            false)
              echo 'diff-coverage-comment is absent; nothing to post.'
              ;;
            *)
              echo "unexpected artifact lookup result: $present" >&2
              exit 1
              ;;
          esac

      - name: Resolve the target pull request from the event
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE_RATCHET_REPO: ${{ github.repository }}
          SIZE_RATCHET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SIZE_RATCHET_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SIZE_RATCHET_EVENT_NUMBERS: >-
            ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          set -euo pipefail

          # Deliberately before the download: the destination is settled
          # while nothing the pull request produced is on disk.
          numbers="$(printf '%s' "$SIZE_RATCHET_EVENT_NUMBERS" | jq -r 'arrays | .[]' \
            | sort -u)"
          if [ -z "$numbers" ]; then
            # A fork pull request arrives with an empty `pull_requests`, and
            # the base repository does not associate its head commit with a
            # pull request, so ask the head repository which one owns it.
            if ! gh api -H 'Cache-Control: no-cache' --paginate \
              "repos/$SIZE_RATCHET_HEAD_REPO/commits/$SIZE_RATCHET_HEAD_SHA/pulls" \
              --jq '.[].number' > pulls.txt
            then
              echo "listing the pull requests for $SIZE_RATCHET_HEAD_SHA failed" >&2
              exit 1
            fi
            numbers="$(sort -u pulls.txt)"
          fi
          count="$(printf '%s\n' "$numbers" | awk 'NF' | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            # A closed pull request's run has nowhere to comment and no
            # head worth a check; that is a real state, not an error.
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "expected one pull request for $SIZE_RATCHET_HEAD_SHA, found $count" >&2
            printf '%s\n' "$numbers" >&2
            exit 1
          fi
          case "$numbers" in
            ''|*[!0-9]*)
              echo "resolved a non-numeric pull request: $numbers" >&2
              exit 1
              ;;
          esac
          if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
            "repos/$SIZE_RATCHET_REPO/pulls/$numbers" --jq '.head.sha')"
          then
            echo "reading the current head of pull request $numbers failed" \
              >&2
            exit 1
          fi
          if [ -z "$current_sha" ]; then
            echo "pull request $numbers has no current head SHA" >&2
            exit 1
          fi
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" != "$SIZE_RATCHET_HEAD_SHA" ]; then
            echo "run $SIZE_RATCHET_HEAD_SHA is stale; current pull request head is " \
              "$current_sha"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$numbers" >> "$GITHUB_OUTPUT"
          echo 'stale=false' >> "$GITHUB_OUTPUT"

      - name: Mark missing patch coverage
        id: missing
        if: >-
          steps.artifact.outputs.present != 'true'
          && steps.pr.outputs.stale != 'true'
          && steps.pr.outputs.present != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE_RATCHET_REPO: ${{ github.repository }}
          SIZE_RATCHET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SIZE_RATCHET_PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          # daedalus's copy of this step also publishes a check run on the
          # pull request's head, so it classifies WHY coverage was missing
          # (documentation-only, cancelled) from the run's jobs. This port
          # has no check to publish, so the marker text stays the one thing
          # every miss says.
          marker='<!-- size-ratchet-diff-coverage -->'
          {
            printf '%s\n\n' "$marker"
            printf 'Patch coverage was not measured for commit %s.\n' \
              "$SIZE_RATCHET_HEAD_SHA"
          } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$SIZE_RATCHET_REPO/issues/$SIZE_RATCHET_PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $SIZE_RATCHET_PR_NUMBER failed" >&2
            exit 1
          fi
          existing="$(
            jq -s 'map(select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith(
                "<!-- size-ratchet-diff-coverage -->")))) |
              .[0].id // empty' comments.json
          )"
          revalidate_head() {
            if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
              "repos/$SIZE_RATCHET_REPO/pulls/$SIZE_RATCHET_PR_NUMBER" --jq '.head.sha')"
            then
              echo "reading the current head of pull request $SIZE_RATCHET_PR_NUMBER" \
                "failed" >&2
              exit 1
            fi
            if [ -z "$current_sha" ]; then
              echo "pull request $SIZE_RATCHET_PR_NUMBER has no current head SHA" >&2
              exit 1
            fi
            if [ "$current_sha" != "$SIZE_RATCHET_HEAD_SHA" ]; then
              echo "run $SIZE_RATCHET_HEAD_SHA is stale; current pull request head is " \
                "$current_sha"
              return 1
            fi
          }
          case "$existing" in
            '') echo 'no patch-coverage marker to update'; exit 0 ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X PATCH "repos/$SIZE_RATCHET_REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "marked patch coverage as unavailable for $SIZE_RATCHET_HEAD_SHA"
              exit 0
              ;;
          esac

      - name: Download the comment artifact
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
          && steps.pr.outputs.present != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diff-coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the pull request comment
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
          && steps.pr.outputs.present != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE_RATCHET_REPO: ${{ github.repository }}
          SIZE_RATCHET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SIZE_RATCHET_PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          test -f body.md
          test -f pr-number.txt

          # Checked, never obeyed. See the header: the producer is untrusted.
          claimed="$(cat pr-number.txt)"
          if [ "$claimed" != "$SIZE_RATCHET_PR_NUMBER" ]; then
            echo "the artifact names pull request '$claimed' but the run" \
              "belongs to '$SIZE_RATCHET_PR_NUMBER'; refusing to post" >&2
            exit 1
          fi

          # The comment API caps a body at 65536 characters. A silently
          # truncated coverage report is a wrong coverage report, so an
          # oversized body is refused rather than trimmed to fit.
          size="$(wc -c < body.md)"
          if [ "$size" -gt 60000 ]; then
            echo "body.md is $size bytes, past the comment limit" >&2
            exit 1
          fi

          marker='<!-- size-ratchet-diff-coverage -->'
          {
            printf '%s\n\n' "$marker"
            printf 'Patch coverage for commit %s.\n\n' "$SIZE_RATCHET_HEAD_SHA"
            cat body.md
          } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$SIZE_RATCHET_REPO/issues/$SIZE_RATCHET_PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $SIZE_RATCHET_PR_NUMBER failed" >&2
            exit 1
          fi
          # Slurped, so pagination cannot yield one id per page, and the
          # body is defaulted, so a null one is not an abort mid-select.
          existing="$(
            jq -s 'map(select(.user.login == "github-actions[bot]" and
              ((.body // "") | startswith(
                "<!-- size-ratchet-diff-coverage -->")))) |
              .[0].id // empty' comments.json
          )"
          revalidate_head() {
            if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
              "repos/$SIZE_RATCHET_REPO/pulls/$SIZE_RATCHET_PR_NUMBER" --jq '.head.sha')"
            then
              echo "reading the current head of pull request $SIZE_RATCHET_PR_NUMBER" \
                "failed" >&2
              exit 1
            fi
            if [ -z "$current_sha" ]; then
              echo "pull request $SIZE_RATCHET_PR_NUMBER has no current head SHA" >&2
              exit 1
            fi
            if [ "$current_sha" != "$SIZE_RATCHET_HEAD_SHA" ]; then
              echo "run $SIZE_RATCHET_HEAD_SHA is stale; current pull request head is " \
                "$current_sha"
              return 1
            fi
          }
          case "$existing" in
            '')
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X POST "repos/$SIZE_RATCHET_REPO/issues/$SIZE_RATCHET_PR_NUMBER/comments" \
                -F body=@comment.md >/dev/null
              echo 'posted a new comment'
              ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X PATCH "repos/$SIZE_RATCHET_REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "updated comment $existing"
              ;;
          esac
