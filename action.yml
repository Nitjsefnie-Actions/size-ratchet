name: Size ratchet
description: >-
  Gate tracked file line counts with a per-type, per-folder ratchet that
  only tightens.
inputs:
  ceilings:
    description: >-
      Multiline `"<type>: <ceiling>"` lines replacing a type's default.
      Types: source, stylesheet, sql, yaml.
    required: false
    default: ''
  overrides:
    description: >-
      Multiline `"<folder>/: <ceiling>"` lines; the longest matching
      repository-relative folder prefix wins. Never applies to an untyped
      file.
    required: false
    default: ''
  exclude:
    description: >-
      Multiline list of exact paths or `<folder>/` prefixes removed from
      measurement.
    required: false
    default: ''
  unclassified:
    description: >-
      ignore (default) or fail: under fail, a measurable file with no
      ceiling, no record and no exclusion fails the run.
    required: false
    default: 'ignore'
  records:
    description: Repository-relative JSON records file.
    required: false
    default: '.github/size-baseline.json'
  member:
    description: >-
      Top-level key of the records file holding the baseline map, instead
      of "baseline". Every other key but tree-budgets' "trees" is
      preserved byte-for-byte on write.
    required: false
    default: ''
  mode:
    description: >-
      auto checks pull requests and, on a push to the default branch,
      commits what tighten writes when push-key is set, or else verifies
      the records are tight (under require-tight false each loose entry is
      a warning; in a run from any workflow but size baseline, a notice
      whatever require-tight says); check or tighten forces one. Other
      events fail closed.
    required: false
    default: 'auto'
  base-ref:
    description: Git revision whose records bind a check.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  stale:
    description: >-
      warn (default) reports a stale record (shrunk, deleted, excluded or
      graduated) as a notice; fail fails the run on one.
    required: false
    default: 'warn'
  require-tight:
    description: >-
      true fails a check whose touched entries differ from what tighten
      would write over the head tree; entries the pull request leaves
      untouched stay a stale notice. false (default) fails neither, and a
      default-branch run with no push-key warns on each loose entry. A
      called run with no push-key never fails on a loose entry.
    required: false
    default: 'false'
  push-key:
    description: >-
      SSH write deploy key that pushes the tightened records to the default
      branch. Pass the environment secret MASTER_PUSH_DEPLOY_KEY of the
      <default branch>-push environment, never a repository secret. Empty
      pushes nothing.
    required: false
    default: ''
  tree-budgets:
    description: >-
      Multiline `"<folder>/"` lines, each budgeting the total line count of
      every regular file under that folder, binary or not, in the records
      file's `trees` map.
      A budget falls with its tree and rises only in a range carrying a
      feat commit. Empty (default) budgets no tree.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # A download outage can outlast any repeat, so neither install may fail
    # the action: the runner needs only the standard library.
    - name: Install Python
      id: install-python
      continue-on-error: true
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - name: Wait before repeating the Python install
      if: steps.install-python.outcome == 'failure'
      shell: bash
      run: sleep 60
    - name: Repeat the Python install
      id: repeat-python
      if: steps.install-python.outcome == 'failure'
      continue-on-error: true
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - name: Fall back to the runner's Python
      if: steps.repeat-python.outcome == 'failure'
      shell: bash
      # With no python3, bash -e fails the action here.
      run: |
        version=$(python3 --version)
        echo "::warning::The action's Python could not be installed; measuring with the runner's $version."
    - name: Measure and apply the ratchet
      id: measure
      shell: bash
      # Inputs are data: none becomes shell program text. -I keeps consumer
      # modules and PYTHONPATH out of Python's import search path. The
      # runner imports the standard library and this action's own modules
      # only, so there is no dependency to pin and no install step.
      env:
        SIZE_RATCHET_CEILINGS: ${{ inputs.ceilings }}
        SIZE_RATCHET_OVERRIDES: ${{ inputs.overrides }}
        SIZE_RATCHET_EXCLUDE: ${{ inputs.exclude }}
        SIZE_RATCHET_UNCLASSIFIED: ${{ inputs.unclassified }}
        SIZE_RATCHET_RECORDS: ${{ inputs.records }}
        SIZE_RATCHET_MEMBER: ${{ inputs.member }}
        SIZE_RATCHET_MODE: ${{ inputs.mode }}
        SIZE_RATCHET_BASE_REF: ${{ inputs.base-ref }}
        SIZE_RATCHET_STALE: ${{ inputs.stale }}
        SIZE_RATCHET_REQUIRE_TIGHT: ${{ inputs.require-tight }}
        SIZE_RATCHET_TREE_BUDGETS: ${{ inputs.tree-budgets }}
        SIZE_RATCHET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Whether a key was passed, never the key: it exists only below.
        SIZE_RATCHET_PUSH_KEY_SET: ${{ inputs.push-key != '' }}
        # A run from any workflow but the install block's own, the test its
        # concurrency group uses: that block's push run commits the records.
        SIZE_RATCHET_CALLED: ${{ github.workflow != 'size baseline' }}
      run: |
        python3 -I "$GITHUB_ACTION_PATH/run.py" --validate-only
        python3 -I "$GITHUB_ACTION_PATH/run.py"
    - name: Push the tightened records
      # Only a default-branch push run with a key stages records to push.
      if: steps.measure.outputs.push == 'true'
      shell: bash
      env:
        SIZE_RATCHET_PUSH_KEY: ${{ inputs.push-key }}
        SIZE_RATCHET_RECORDS: ${{ inputs.records }}
        SIZE_RATCHET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python3 -I "$GITHUB_ACTION_PATH/run.py" --push
